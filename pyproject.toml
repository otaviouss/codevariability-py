[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codevariability-py"
dynamic = ["version"]
description = "Source-code similarity matrices, representative rankings, and independent group comparison."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Otávio Gomes"}]
maintainers = [{name = "Otávio Gomes"}]
keywords = ["code similarity", "source code analysis", "ast", "software metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "scikit-learn>=1.5.0",
    "rapidfuzz>=3.0",
    "Pygments>=2.20.0,<3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "hypothesis>=6.168.3", "mypy>=2.4", "ruff>=0.14", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/otaviouss/codevariability-py"
Documentation = "https://github.com/otaviouss/codevariability-py/tree/main/docs"
Source = "https://github.com/otaviouss/codevariability-py"
Issues = "https://github.com/otaviouss/codevariability-py/issues"

[project.scripts]
codevariability = "codevariability.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["codevariability*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "codevariability.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src/codevariability"]
# Dependencies without stubs are still exercised by runtime/property tests.
ignore_missing_imports = true
