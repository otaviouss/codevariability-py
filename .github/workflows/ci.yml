name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip 'setuptools>=83.0.0'
      - run: python -m pip install '.[dev]' pip-audit
      - run: python -m pip check
      - run: python -m ruff check src tests examples
      - run: python -m mypy src/codevariability
      - run: python -m pytest
      - run: python -m pip_audit .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/wheel-consumer"
          "$RUNNER_TEMP/wheel-consumer/bin/python" -m pip install --upgrade pip 'setuptools>=83.0.0'
          "$RUNNER_TEMP/wheel-consumer/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-consumer/bin/python" -m pip check
          "$RUNNER_TEMP/wheel-consumer/bin/codevariability" --version
          "$RUNNER_TEMP/wheel-consumer/bin/python" examples/basic.py
          "$RUNNER_TEMP/wheel-consumer/bin/python" examples/groups.py
          "$RUNNER_TEMP/wheel-consumer/bin/python" examples/interop.py
