name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distribution to production PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip 'setuptools>=83.0.0'
      - run: python -m pip install '.[dev]' pip-audit
      - run: python -m pip check
      - run: python -m ruff check src tests examples
      - run: python -m mypy src/codevariability
      - run: python -m pytest
      - run: python -m pip_audit .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed distribution identity and CLI
        run: |
          python -m venv "$RUNNER_TEMP/release-consumer"
          "$RUNNER_TEMP/release-consumer/bin/python" -m pip install --upgrade pip 'setuptools>=83.0.0'
          "$RUNNER_TEMP/release-consumer/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-consumer/bin/python" -m pip check
          "$RUNNER_TEMP/release-consumer/bin/python" -c "import codevariability; from importlib.metadata import version; assert version('codevariability') == codevariability.__version__"
          "$RUNNER_TEMP/release-consumer/bin/codevariability" --version
          "$RUNNER_TEMP/release-consumer/bin/python" examples/basic.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codevariability/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
